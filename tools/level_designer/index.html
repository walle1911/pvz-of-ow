html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;pvz-level-designer&quot;&gt;

  &lt;/style&gt;

  &lt;div class=&quot;layout&quot;&gt;

        &lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;form-label&quot; for=&quot;waves&quot;&gt;波数&lt;/label&gt;&lt;input class=&quot;form-control&quot; id=&quot;waves&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;10&quot;&gt;&lt;/div&gt;

        &lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;form-label&quot; for=&quot;sun&quot;&gt;初始阳光&lt;/label&gt;&lt;input class=&quot;form-control&quot; id=&quot;sun&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;150&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;lawn&quot; id=&quot;lawn&quot; role=&quot;grid&quot; aria-label=&quot;5 行 9 列的预种植物棋盘&quot;&gt;&lt;/div&gt;

        &lt;h3&gt;导出内容&lt;/h3&gt;
        &lt;p class=&quot;hint text-small text-muted&quot;&gt;生成的是当前项目的 &lt;code&gt;ResourceLevelData&lt;/code&gt; 文本资源，可保存到 &lt;code&gt;level_game_para/&lt;/code&gt; 后从“自定义关卡”加载。植物、僵尸 ID 仍需先在 &lt;code&gt;CharacterRegistry&lt;/code&gt; 注册。&lt;/p&gt;

    &lt;section class=&quot;panel card&quot; aria-label=&quot;资源预览&quot;&gt;
      &lt;h2&gt;ResourceLevelData&lt;/h2&gt;

  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;pvz-level-designer&#x27;);
    const $ = (id) =&gt; root.querySelector(&#x27;#&#x27; + id);
    const board = Array.from({length:5}, () =&gt; Array(9).fill(null));
    const numbers = (raw) =&gt; raw.split(&#x27;,&#x27;).map(x =&gt; x.trim()).filter(Boolean).map(Number).filter(Number.isFinite).map(Math.trunc);
    const val = (id) =&gt; $(id).value;
    const bool = (id) =&gt; $(id).checked;
    const bgMusic = (bg) =&gt; ({0:0,1:1,2:2,3:3,4:4})[bg] ?? 0;
    function resourceId(i) { return &#x27;Resource_lv&#x27; + String(i + 1).padStart(3,&#x27;0&#x27;); }
    function bgFlags(bg) { return { is_day: bg === 0 || bg === 2 || bg === 4, is_day_sun: bg === 0 || bg === 2 || bg === 4, is_fog: bg === 3, is_rain: bg === 3 }; }
    function renderBoard() {
      const bg = Number(val(&#x27;background&#x27;));
      const lawn = $(&#x27;lawn&#x27;); lawn.innerHTML = &#x27;&#x27;;
      board.forEach((row, r) =&gt; row.forEach((plant, c) =&gt; {
        const b = document.createElement(&#x27;button&#x27;); b.type = &#x27;button&#x27;; b.className = &#x27;cell&#x27; + ((bg === 2 || bg === 3) &amp;&amp; (r === 2 || r === 3) ? &#x27; water&#x27; : &#x27;&#x27;);
        b.setAttribute(&#x27;role&#x27;,&#x27;gridcell&#x27;); b.setAttribute(&#x27;aria-label&#x27;, `第${r+1}行第${c+1}列${plant ? &#x27;，植物 &#x27;+plant : &#x27;，空&#x27;}`);
        b.innerHTML = `&lt;span class=&quot;coord&quot;&gt;${r+1},${c+1}&lt;/span&gt;${plant ? `&lt;span class=&quot;plant&quot;&gt;P${plant}&lt;/span&gt;` : &#x27;&#x27;}`;
        b.addEventListener(&#x27;click&#x27;, () =&gt; { const id = Number(val(&#x27;plant-id&#x27;)); if (!Number.isInteger(id) || id &lt; 0) return setStatus(&#x27;植物 ID 必须是非负整数。&#x27;, true); board[r][c] = id; update(); });
        b.addEventListener(&#x27;contextmenu&#x27;, (e) =&gt; { e.preventDefault(); board[r][c] = null; update(); });
        lawn.appendChild(b);
      }));
      $(&#x27;board-summary&#x27;).textContent = `${board.flat().filter(x =&gt; x !== null).length} 个预种`;
    }
    function build() {
      const bg = Number(val(&#x27;background&#x27;)), mode = Number(val(&#x27;card-mode&#x27;)), flags = bgFlags(bg);
      const placed = [];
      board.forEach((row,r) =&gt; row.forEach((plant,c) =&gt; { if (plant !== null) placed.push({plant,r:r+1,c:c+1}); }));
      const ext = placed.length ? &#x27;[ext_resource type=&quot;Script&quot; path=&quot;res://scripts/resources/level/pre_plant_in_level.gd&quot; id=&quot;2_preplant&quot;]\n&#x27; : &#x27;&#x27;;
      const sub = placed.map((p,i) =&gt; `[sub_resource type=&quot;Resource&quot; id=&quot;${resourceId(i)}&quot;]\nscript = ExtResource(&quot;2_preplant&quot;)\nplant_type = ${p.plant}\nplant_cell_pos = Vector2i(${p.r}, ${p.c})\n`).join(&#x27;\n&#x27;);
      const refs = placed.length ? `all_pre_plant_data = Array[ExtResource(&quot;2_preplant&quot;)]([${placed.map((_,i) =&gt; `SubResource(&quot;${resourceId(i)}&quot;)`).join(&#x27;, &#x27;)}])\n` : &#x27;&#x27;;
      const zombies = numbers(val(&#x27;zombie-ids&#x27;)), plants = numbers(val(&#x27;preset-plants&#x27;));
      const canChoose = mode === 1;
      const conveyor = mode === 2;
      return `[gd_resource type=&quot;Resource&quot; script_class=&quot;ResourceLevelData&quot; load_steps=${2 + (placed.length ? placed.length + 1 : 0)} format=3]\n\n[ext_resource type=&quot;Script&quot; path=&quot;res://scripts/resources/level/level_data.gd&quot; id=&quot;1_level&quot;]\n${ext}\n${sub}[resource]\nscript = ExtResource(&quot;1_level&quot;)\ngame_BG = ${bg}\ngame_BGM = ${bgMusic(bg)}\nis_fog = ${flags.is_fog}\nis_rain = ${flags.is_rain}\nis_day = ${flags.is_day}\nis_day_sun = ${conveyor ? false : bool(&#x27;sun-drop&#x27;) &amp;&amp; flags.is_day_sun}\nis_lawn_mover = ${bool(&#x27;mowers&#x27;)}\n${refs}can_choosed_card = ${canChoose}\nmonster_mode = 1\nmax_wave = ${Math.max(0, Number(val(&#x27;waves&#x27;)) || 0)}\nzombie_refresh_types = Array[int]([${zombies.join(&#x27;, &#x27;)}])\ncard_mode = ${mode}\nmax_choosed_card_num = ${Math.max(1, Math.min(15, Number(val(&#x27;slots&#x27;)) || 1))}\nstart_sun = ${Math.max(0, Number(val(&#x27;sun&#x27;)) || 0)}\npre_choosed_card_list_plant = Array[int]([${plants.join(&#x27;, &#x27;)}])\n`;
    }
    function update() { renderBoard(); $(&#x27;output&#x27;).value = build(); }
    function setStatus(message, error=false) { const node = $(&#x27;status&#x27;); node.textContent = message; node.className = &#x27;status text-small&#x27; + (error ? &#x27; text-destructive&#x27; : &#x27;&#x27;); }
    [&#x27;level-name&#x27;,&#x27;background&#x27;,&#x27;waves&#x27;,&#x27;sun&#x27;,&#x27;slots&#x27;,&#x27;card-mode&#x27;,&#x27;mowers&#x27;,&#x27;sun-drop&#x27;,&#x27;plant-id&#x27;,&#x27;preset-plants&#x27;,&#x27;zombie-ids&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;input&#x27;, update));
    $(&#x27;clear-grid&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { board.forEach(row =&gt; row.fill(null)); update(); setStatus(&#x27;已清空预种植物。&#x27;); });
    $(&#x27;copy-tres&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; { try { await navigator.clipboard.writeText($(&#x27;output&#x27;).value); setStatus(`已复制。建议保存为 level_game_para/${val(&#x27;level-name&#x27;).trim() || &#x27;custom_level&#x27;}.tres`); } catch { $(&#x27;output&#x27;).select(); document.execCommand(&#x27;copy&#x27;); setStatus(&#x27;已复制到剪贴板。&#x27;); } });
    update();
  })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }

      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

    }

    }

    const trigger = getTrigger(event.target);

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
